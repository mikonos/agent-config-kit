<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小红书正文卡片</title>
    <style>
      /* 参考结构：comeonzhj/Auto-Redbook-Skills（MIT）并做了“红薯白底卡片化”适配 */
      :root{
        --w: 1080px;
        --h: 1440px;
        --bg1: #ff2442;
        --bg2: #ff8a00;
        --paper: rgba(255,255,255,0.96);
        --ink: rgba(17,17,17,0.92);
        --muted: rgba(17,17,17,0.62);
        --border: rgba(17,17,17,0.10);
        --radius: 28px;
      }
      *{ box-sizing: border-box; margin:0; padding:0; }
      body{
        width: var(--w);
        min-height: var(--h);
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: transparent;
        color: var(--ink);
      }
      .card{
        width: var(--w);
        min-height: var(--h);
        padding: 52px;
        background:
          radial-gradient(900px 700px at 80% 0%, rgba(255,36,66,0.22), transparent 55%),
          radial-gradient(900px 700px at 10% 25%, rgba(255,138,0,0.18), transparent 55%),
          linear-gradient(135deg, rgba(255,36,66,0.18) 0%, rgba(255,138,0,0.16) 100%),
          #fff;
        position: relative;
      }
      .inner{
        width: 100%;
        min-height: calc(var(--h) - 104px);
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 30px 80px rgba(0,0,0,0.10);
        padding: 72px 66px 58px 66px;
      }

      /* Markdown-ish content styles */
      .content{
        font-size: 34px;
        line-height: 1.45;
        color: rgba(17,17,17,0.86);
      }
      .content h1{
        font-size: 64px;
        line-height: 1.18;
        margin: 0 0 26px 0;
        letter-spacing: -0.4px;
        color: var(--ink);
      }
      .content h2{
        font-size: 48px;
        line-height: 1.25;
        margin: 34px 0 16px 0;
        color: rgba(17,17,17,0.88);
      }
      .content p{ margin: 14px 0; }
      .content ul{
        margin: 14px 0 10px 0;
        padding-left: 34px;
        display: grid;
        gap: 10px;
      }
      .content li{ line-height: 1.38; }
      .content blockquote{
        margin: 18px 0;
        padding: 18px 18px 18px 20px;
        border-left: 6px solid rgba(255,36,66,0.55);
        background: rgba(255,36,66,0.06);
        border-radius: 14px;
        color: rgba(17,17,17,0.72);
      }
      .content code{
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 30px;
        padding: 2px 10px;
        border-radius: 10px;
        background: rgba(17,17,17,0.06);
      }
      .content pre{
        margin: 18px 0;
        padding: 18px;
        border-radius: 16px;
        background: rgba(17,17,17,0.92);
        color: rgba(255,255,255,0.92);
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        font-size: 28px;
        line-height: 1.35;
      }
      .content pre code{ background: transparent; padding: 0; color: inherit; }

      .pageNo{
        position: absolute;
        right: 64px;
        bottom: 64px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(17,17,17,0.06);
        border: 1px solid rgba(17,17,17,0.10);
        color: rgba(17,17,17,0.62);
        font-size: 22px;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="inner">
        <div class="content">
          {{CONTENT}}
        </div>
      </div>
      <div class="pageNo">{{PAGE_NUMBER}}</div>
    </div>
  </body>
</html>
