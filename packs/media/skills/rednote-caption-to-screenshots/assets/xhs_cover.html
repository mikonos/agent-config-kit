<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小红书封面</title>
    <style>
      /* 参考结构：comeonzhj/Auto-Redbook-Skills（MIT）并做了无外链字体/更“红薯白底”适配 */
      :root{
        --w: 1080px;
        --h: 1440px;
        --bg1: #ff2442;
        --bg2: #ff8a00;
        --paper: #ffffff;
        --ink: rgba(17,17,17,0.92);
        --muted: rgba(17,17,17,0.62);
        --radius: 28px;
      }
      *{ box-sizing: border-box; margin:0; padding:0; }
      body{
        width: var(--w);
        height: var(--h);
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: transparent;
      }
      .cover{
        width: var(--w);
        height: var(--h);
        padding: 52px;
        background:
          radial-gradient(900px 700px at 80% 0%, rgba(255,36,66,0.28), transparent 55%),
          radial-gradient(900px 700px at 10% 25%, rgba(255,138,0,0.22), transparent 55%),
          linear-gradient(135deg, rgba(255,36,66,0.20) 0%, rgba(255,138,0,0.18) 100%),
          #fff;
      }
      .inner{
        width: 100%;
        height: 100%;
        background: rgba(255,255,255,0.96);
        border: 1px solid rgba(17,17,17,0.10);
        border-radius: var(--radius);
        box-shadow: 0 30px 80px rgba(0,0,0,0.10);
        padding: 84px 78px 72px 78px;
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .emoji{
        font-size: 148px;
        line-height: 1;
        margin-bottom: 10px;
      }
      .title{
        font-weight: 900;
        font-size: 112px;
        letter-spacing: -1px;
        line-height: 1.15;
        color: var(--ink);
        word-break: break-word;
      }
      .subtitle{
        margin-top: auto;
        font-weight: 650;
        font-size: 56px;
        line-height: 1.25;
        color: var(--muted);
      }
      .badge{
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(255,36,66,0.10);
        border: 1px solid rgba(255,36,66,0.25);
        color: rgba(17,17,17,0.86);
        font-size: 22px;
        font-weight: 650;
        width: fit-content;
      }
      .dot{
        width: 8px; height: 8px; border-radius: 999px;
        background: linear-gradient(90deg, var(--bg1), var(--bg2));
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="inner">
        <div class="badge"><span class="dot"></span>可收藏 · 3:4</div>
        <div class="emoji">{{EMOJI}}</div>
        <div class="title">{{TITLE}}</div>
        <div class="subtitle">{{SUBTITLE}}</div>
      </div>
    </div>
  </body>
</html>
