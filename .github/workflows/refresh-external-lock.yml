name: refresh external Skill lock

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-external-skill-lock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Refresh reviewed lock candidates
        run: >-
          python scripts/refresh_external_lock.py
          --apply
          --report "$RUNNER_TEMP/external-lock-update.md"
      - name: Detect lock changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- catalog/external_skills.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify changed lock
        if: steps.changes.outputs.changed == 'true'
        run: |
          python install/scripts/externalctl.py verify-catalog
          python -m unittest discover -s tests -p "test_externalctl.py"
          python -m unittest discover -s tests -p "test_refresh_external_lock.py"
          python scripts/verify.py
      - name: Create or update review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/external-skill-lock"
          git fetch origin "$branch" || true
          git checkout -B "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/external_skills.json
          git commit -m "chore: refresh external Skill lock"
          git push --force-with-lease origin "$branch"
          number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: refresh external Skill lock" \
              --body-file "$RUNNER_TEMP/external-lock-update.md"
          else
            gh pr edit "$number" \
              --title "chore: refresh external Skill lock" \
              --body-file "$RUNNER_TEMP/external-lock-update.md"
          fi
